matrix:
- name: Markdown
  aspell:
    lang: en
  dictionary:
    wordlists:
    - .wordlist.txt
    encoding: utf-8
  pipeline:
  - pyspelling.filters.markdown:
  - pyspelling.filters.html:
      comments: false
      ignores:
      - code
      - pre
  sources:
  # Match every Markdown file, but skip AI-generated Markdown that is not
  # authored prose: CLAUDE.md guidance and anything under .claude/.
  - '**/*.md|!CLAUDE.md|!.claude/**'
  default_encoding: utf-8
